<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi DJ Turntables & Playlist Player</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- YouTube API -->
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap');
        body {
            font-family: 'Inter', sans-serif;
            background-color: #111827; /* Dark theme for DJ feel */
            color: #f3f4f6;
            min-height: 100vh;
        }

        /* --- Normal Mode Layout --- */
        .dj-stage {
            position: relative;
            width: 100%;
            transition: aspect-ratio 0.4s ease;
        }
        .video-container {
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: #000;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            border-radius: 0.5rem;
            margin: 0 auto;
        }
        .video-container iframe, .video-container > div.api-target {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        /* --- DJ Mode Transformations --- */
        /* Force a perfect square stage */
        .dj-mode-stage {
            aspect-ratio: 1 / 1;
        }
        
        .dj-mode-active.video-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            aspect-ratio: 1 / 1; /* Overrides the 16:9 to force perfect circle */
            border-radius: 50%;
            box-shadow: 0 0 40px rgba(0,0,0,0.8), inset 0 0 20px rgba(0,0,0,0.9);
            clip-path: circle(50% at 50% 50%);
        }
        
        /* Scale iframe up so black bars and edges are hidden behind the circle crop */
        .dj-mode-active iframe, .dj-mode-active div.api-target {
            width: 200% !important;
            height: 200% !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            pointer-events: none; /* Block YouTube native UI completely */
        }

        /* --- Turntable UI --- */
        .turntable-overlay {
            position: absolute;
            inset: 0;
            border-radius: 50%;
            /* Record vinyl grooves */
            background: repeating-radial-gradient(
                circle,
                rgba(20,20,20,0.7) 0,
                rgba(30,30,30,0.7) 2px,
                rgba(10,10,10,0.8) 4px
            );
            cursor: grab;
            z-index: 10;
            touch-action: none;
        }
        .turntable-overlay:active { cursor: grabbing; }
        
        .turntable-label {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 30%; height: 30%;
            border-radius: 50%;
            border: 2px dashed rgba(255,255,255,0.4);
            pointer-events: none;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
            background: rgba(0,0,0,0.3);
        }

        /* --- Waveform Canvases --- */
        .waveform-linear {
            width: 100%;
            height: 60px;
            background: #1f2937;
            border-radius: 0.25rem;
            cursor: crosshair;
        }
        .waveform-circular {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
            z-index: 5; /* Behind turntable but clickable on the outer edges */
        }

        /* --- Crayon Palette --- */
        .crayon-tool {
            width: 24px; height: 24px; border-radius: 50%;
            cursor: pointer; transition: transform 0.1s;
        }
        .crayon-tool:hover { transform: scale(1.1); }
        .crayon-tool.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px currentColor; }
        
        .rubber-tool {
            width: 24px; height: 24px; border-radius: 4px; background: #000;
            cursor: pointer; transition: transform 0.1s; border: 1px solid #444;
        }
        .rubber-tool:hover { transform: scale(1.1); }
        .rubber-tool.active { box-shadow: 0 0 0 2px #fff, 0 0 0 4px #000; }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #374151; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #6b7280; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #9ca3af; }
    </style>
</head>
<body class="flex flex-col items-center p-4 sm:p-6 lg:p-8">

    <!-- Global Header -->
    <div class="w-full max-w-[1800px] flex flex-col sm:flex-row items-start sm:items-center justify-between mb-6 gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-white">DJ Vinyl Station</h1>
            <p class="text-gray-400 text-sm mt-1">Scratch YouTube videos. Add markers. Record your mic.</p>
        </div>
        <div class="flex flex-wrap gap-3">
            <button id="micRecordBtn" class="bg-red-500 hover:bg-red-600 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-2">
                🎙️ Record Mic
            </button>
            <button id="addPlayerBtn" class="bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2 px-4 rounded-lg shadow transition flex items-center gap-2">
                ➕ Add Deck
            </button>
        </div>
    </div>

    <!-- Multi Player Grid -->
    <div id="players-grid" class="grid grid-cols-1 xl:grid-cols-2 2xl:grid-cols-3 gap-6 w-full max-w-[1800px]">
        <!-- Dynamic containers inserted here -->
    </div>

    <!-- ==========================================
         TEMPLATE: Single Player Deck
         ========================================== -->
    <template id="player-template">
        <div class="player-instance w-full bg-gray-800 p-5 rounded-2xl shadow-2xl flex flex-col h-full border border-gray-700 transition-all">
            
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-2xl font-bold text-white player-name">Deck</h2>
                <div class="flex gap-2">
                    <button class="dj-mode-toggle text-xs font-bold text-white bg-purple-600 px-3 py-1.5 rounded-md hover:bg-purple-700 transition shadow">🎧 Enter DJ Mode</button>
                    <button class="delete-player-btn text-xs font-semibold text-red-500 px-2 py-1 bg-red-900/30 hover:bg-red-900/60 rounded-md transition" title="Remove Player">✕</button>
                </div>
            </div>

            <!-- PLAYER SECTION (Hidden initially) -->
            <div class="video-section hidden mb-5 bg-gray-900 rounded-xl overflow-hidden shadow-inner flex-shrink-0 flex flex-col">
                
                <!-- Deck Header -->
                <div class="p-3 flex justify-between items-center bg-gray-950 text-white z-20 relative border-b border-gray-800">
                    <span class="video-display-title font-bold truncate pr-4 text-sm text-gray-200"></span>
                    <button class="close-video-btn text-gray-500 hover:text-white transition focus:outline-none">✕</button>
                </div>

                <!-- STAGE (Normal / DJ layout) -->
                <div class="dj-stage bg-gray-900 p-4">
                    <!-- Circular Waveform Canvas (Behind Turntable, visible in DJ Mode) -->
                    <canvas class="waveform-circular hidden"></canvas>

                    <!-- The Video / Turntable Container -->
                    <div class="video-embed-container video-container relative group">
                        <!-- Turntable Overlay (shown in DJ mode) -->
                        <div class="turntable-overlay hidden group-[.dj-mode-active]:block">
                            <!-- Label & Visual Spinning Needle -->
                            <div class="turntable-label flex items-center justify-center font-bold text-[10px] text-white/30 tracking-widest">
                                <div class="absolute top-0 left-1/2 w-1.5 h-4 bg-red-500 transform -translate-x-1/2 rounded-b-sm"></div>
                                VINYL
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Linear Waveform (Visible in Normal Mode) -->
                <div class="px-4 pb-2 linear-waveform-container">
                    <canvas class="waveform-linear"></canvas>
                </div>

                <!-- Deck Controls -->
                <div class="bg-gray-950 p-4 flex flex-col gap-3">
                    
                    <!-- Transport & Volume -->
                    <div class="flex items-center justify-between gap-4">
                        <div class="flex gap-2">
                            <button class="btn-play px-3 py-1.5 bg-green-600 hover:bg-green-500 text-white rounded font-bold text-xs transition">▶ Play</button>
                            <button class="btn-pause px-3 py-1.5 bg-yellow-600 hover:bg-yellow-500 text-white rounded font-bold text-xs transition">⏸ Pause</button>
                            <button class="btn-stop px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white rounded font-bold text-xs transition">⏹ Stop</button>
                        </div>
                        <div class="flex items-center gap-2 text-gray-400 text-xs font-semibold flex-grow max-w-[150px]">
                            <span>VOL</span>
                            <input type="range" min="0" max="100" value="100" class="vol-slider w-full h-1.5 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-indigo-500">
                        </div>
                    </div>

                    <!-- Marker Crayon Palette -->
                    <div class="flex items-center justify-between bg-gray-800 p-2 rounded-lg mt-1">
                        <div class="text-xs text-gray-400 font-semibold mr-2 uppercase">Crayons</div>
                        <div class="flex gap-3 items-center crayon-palette">
                            <div class="crayon-tool bg-red-500 text-red-500 active" data-color="#ef4444"></div>
                            <div class="crayon-tool bg-blue-500 text-blue-500" data-color="#3b82f6"></div>
                            <div class="crayon-tool bg-green-500 text-green-500" data-color="#10b981"></div>
                            <div class="crayon-tool bg-yellow-400 text-yellow-400" data-color="#facc15"></div>
                            <div class="crayon-tool bg-purple-500 text-purple-500" data-color="#a855f7"></div>
                            <div class="w-px h-6 bg-gray-600 mx-1"></div>
                            <div class="rubber-tool" data-color="rubber" title="Eraser"></div>
                        </div>
                        <div class="text-xs font-mono text-gray-500 time-display">0:00 / 0:00</div>
                    </div>

                </div>
            </div>

            <!-- Add Video Form -->
            <div class="mb-5 p-4 bg-gray-750 bg-gray-900 rounded-xl border border-gray-700">
                <h3 class="text-xs font-bold mb-3 text-gray-400 uppercase tracking-wider">Load Track</h3>
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" class="video-title-input w-full sm:w-1/3 p-2 bg-gray-800 border border-gray-600 rounded text-sm text-white focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-500" placeholder="Auto-title if blank">
                    <input type="url" class="video-url-input w-full sm:w-2/3 p-2 bg-gray-800 border border-gray-600 rounded text-sm text-white focus:ring-indigo-500 focus:border-indigo-500 placeholder-gray-500" placeholder="Paste YouTube URL">
                    <button class="add-btn bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-2 px-5 rounded transition text-sm flex-shrink-0">Load</button>
                </div>
            </div>

            <!-- Playlist Area -->
            <div class="flex flex-col flex-grow min-h-[200px]">
                <h3 class="text-sm font-bold mb-2 text-gray-400 uppercase tracking-wider">Crate (<span class="playlist-count">0</span>)</h3>
                <div class="playlist-container custom-scrollbar bg-gray-900 border border-gray-700 rounded-xl divide-y divide-gray-800 flex-grow max-h-[300px] overflow-y-auto">
                    <!-- Items appended here -->
                </div>
            </div>
            
            <div class="message-box mt-3 p-2 bg-yellow-900/50 border border-yellow-700 text-yellow-400 text-xs rounded-lg hidden transition-opacity text-center"></div>
        </div>
    </template>

    <script>
        // --- Global YouTube API Ready Tracker ---
        let isYouTubeReady = false;
        window.onYouTubeIframeAPIReady = function() { isYouTubeReady = true; };

        // --- Microphone Recording System ---
        const MicRecorder = {
            stream: null,
            recorder: null,
            chunks: [],
            isRecording: false,
            async toggle() {
                const btn = document.getElementById('micRecordBtn');
                if (this.isRecording) {
                    this.recorder.stop();
                    this.isRecording = false;
                    btn.innerHTML = '🎙️ Record Mic';
                    btn.classList.remove('bg-red-800', 'animate-pulse');
                    btn.classList.add('bg-red-500');
                } else {
                    try {
                        this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        this.recorder = new MediaRecorder(this.stream);
                        this.chunks = [];
                        this.recorder.ondataavailable = e => this.chunks.push(e.data);
                        this.recorder.onstop = () => {
                            const blob = new Blob(this.chunks, { type: 'audio/webm' });
                            const url = URL.createObjectURL(blob);
                            const a = document.createElement('a');
                            a.href = url; a.download = `DJ_Mic_Recording_${Date.now()}.webm`;
                            a.click();
                            this.stream.getTracks().forEach(t => t.stop()); // Stop mic usage
                        };
                        this.recorder.start();
                        this.isRecording = true;
                        btn.innerHTML = '🛑 Stop & Save';
                        btn.classList.remove('bg-red-500');
                        btn.classList.add('bg-red-800', 'animate-pulse');
                    } catch (err) {
                        alert("Microphone access denied or error occurred.");
                    }
                }
            }
        };

        // --- Global Helper Functions ---
        function extractYoutubeId(url) {
            const pattern = /(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|v\/|shorts\/))([^&\n?#]+)/i;
            const match = url.match(pattern);
            return (match && match[1] && match[1].length === 11) ? match[1] : null;
        }

        async function fetchYoutubeTitle(id) {
            try {
                // Public oEmbed endpoint to grab title without API key
                const res = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${id}`);
                const data = await res.json();
                return data.title || null;
            } catch (e) { return null; }
        }

        function formatTime(seconds) {
            if (isNaN(seconds)) return "0:00";
            const m = Math.floor(seconds / 60);
            const s = Math.floor(seconds % 60);
            return `${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // --- Class Definition for a Player Instance ---
        class PlaylistPlayer {
            constructor(containerId, storageKey, playerName) {
                this.containerParent = document.getElementById(containerId);
                this.storageKey = storageKey;
                this.playlistData = [];
                this.currentVideoIndex = -1;
                
                // Audio & DJ State
                this.ytPlayer = null; 
                this.isDjMode = false;
                this.playbackState = { currentTime: 0, duration: 1, playing: false };
                this.pollInterval = null;
                
                // Waveform & Markers
                this.activeColor = '#ef4444'; // Default crayon
                this.markers = []; // { time, color }
                this.waveformAmplitudes = Array.from({length: 120}, () => Math.random() * 0.8 + 0.2); // Fake waveform data

                // Turntable interaction
                this.isDragging = false;
                this.lastAngle = null;

                // 1. Create Wrapper and Clone Template
                this.container = document.createElement('div');
                this.containerParent.appendChild(this.container);
                const template = document.getElementById('player-template').content.cloneNode(true);
                this.container.appendChild(template);

                // 2. Bind DOM Elements
                this.els = {
                    nameHeader: this.container.querySelector('.player-name'),
                    videoSection: this.container.querySelector('.video-section'),
                    videoDisplayTitle: this.container.querySelector('.video-display-title'),
                    closeVideoBtn: this.container.querySelector('.close-video-btn'),
                    embedContainer: this.container.querySelector('.video-embed-container'),
                    titleInput: this.container.querySelector('.video-title-input'),
                    urlInput: this.container.querySelector('.video-url-input'),
                    addBtn: this.container.querySelector('.add-btn'),
                    playlistContainer: this.container.querySelector('.playlist-container'),
                    playlistCount: this.container.querySelector('.playlist-count'),
                    messageBox: this.container.querySelector('.message-box'),
                    deleteBtn: this.container.querySelector('.delete-player-btn'),
                    
                    // Transport
                    btnPlay: this.container.querySelector('.btn-play'),
                    btnPause: this.container.querySelector('.btn-pause'),
                    btnStop: this.container.querySelector('.btn-stop'),
                    volSlider: this.container.querySelector('.vol-slider'),
                    timeDisplay: this.container.querySelector('.time-display'),
                    
                    // DJ & Canvas
                    djToggle: this.container.querySelector('.dj-mode-toggle'),
                    djStage: this.container.querySelector('.dj-stage'),
                    turntable: this.container.querySelector('.turntable-overlay'),
                    canvasLinear: this.container.querySelector('.waveform-linear'),
                    canvasCircular: this.container.querySelector('.waveform-circular'),
                    linearContainer: this.container.querySelector('.linear-waveform-container'),
                    
                    // Crayons
                    crayons: this.container.querySelectorAll('.crayon-tool, .rubber-tool')
                };

                this.els.nameHeader.textContent = playerName;

                // 3. Attach Event Listeners
                this.els.addBtn.addEventListener('click', () => this.addItem());
                this.els.closeVideoBtn.addEventListener('click', () => this.closeVideo());
                this.els.deleteBtn.addEventListener('click', () => {
                    if (confirm(`Remove ${playerName}? Data is kept in local storage.`)) {
                        this.destroy(); this.container.remove();
                    }
                });

                // Transport Controls
                this.els.btnPlay.addEventListener('click', () => this.ytPlayer && this.ytPlayer.playVideo());
                this.els.btnPause.addEventListener('click', () => this.ytPlayer && this.ytPlayer.pauseVideo());
                this.els.btnStop.addEventListener('click', () => {
                    if(this.ytPlayer) { this.ytPlayer.pauseVideo(); this.apiSeekTo(0); }
                });
                this.els.volSlider.addEventListener('input', (e) => {
                    if(this.ytPlayer) this.ytPlayer.setVolume(parseInt(e.target.value));
                });

                // DJ Mode Events
                this.els.djToggle.addEventListener('click', () => this.toggleDjMode());
                
                // Crayon Palette
                this.els.crayons.forEach(c => {
                    c.addEventListener('click', (e) => {
                        this.els.crayons.forEach(btn => btn.classList.remove('active'));
                        e.target.classList.add('active');
                        this.activeColor = e.target.dataset.color;
                    });
                });

                // Canvas & Turntable Clicks/Drags
                const tt = this.els.turntable;
                tt.addEventListener('mousedown', (e) => this.startDrag(e));
                tt.addEventListener('touchstart', (e) => this.startDrag(e.touches[0]), {passive: false});
                window.addEventListener('mousemove', (e) => this.onDrag(e));
                window.addEventListener('touchmove', (e) => this.onDrag(e.touches[0]), {passive: false});
                window.addEventListener('mouseup', () => this.endDrag());
                window.addEventListener('touchend', () => this.endDrag());

                this.els.canvasLinear.addEventListener('mousedown', (e) => this.handleCanvasClick(e, 'linear'));
                this.els.canvasCircular.addEventListener('mousedown', (e) => this.handleCanvasClick(e, 'circular'));

                // Window Resize Observer for Canvases
                window.addEventListener('resize', () => {
                    this.resizeCanvases();
                    this.drawWaveforms();
                });

                // 4. Load initial data
                this.loadPlaylistFromLocal();
                this.resizeCanvases();
            }

            // --- UI & Storage ---
            showMessage(msg) {
                this.els.messageBox.textContent = msg;
                this.els.messageBox.classList.remove('hidden');
                setTimeout(() => this.els.messageBox.classList.add('hidden'), 4000);
            }

            loadPlaylistFromLocal() {
                try {
                    const d = localStorage.getItem(this.storageKey);
                    if (d) this.playlistData = JSON.parse(d);
                } catch(e) {}
                
                // Load saved markers per player
                try {
                    const m = localStorage.getItem(this.storageKey + '_markers');
                    if (m) this.markers = JSON.parse(m);
                } catch(e){}

                this.updatePlaylistUI();
            }

            saveDataToLocal() {
                localStorage.setItem(this.storageKey, JSON.stringify(this.playlistData));
                localStorage.setItem(this.storageKey + '_markers', JSON.stringify(this.markers));
            }

            async addItem() {
                const url = this.els.urlInput.value.trim();
                const ytId = extractYoutubeId(url);
                if (!ytId) return this.showMessage('Valid YouTube URL required.');
                
                let title = this.els.titleInput.value.trim();
                
                // Visual loading state
                const origBtnText = this.els.addBtn.textContent;
                this.els.addBtn.textContent = '...';
                
                if (!title) {
                    const fetchedTitle = await fetchYoutubeTitle(ytId);
                    title = fetchedTitle || `[YOUTUBE] ID: ${ytId}`;
                }
                
                this.els.addBtn.textContent = origBtnText;

                this.playlistData.push({ title, id: ytId });
                this.saveDataToLocal();
                this.updatePlaylistUI();
                this.els.titleInput.value = '';
                this.els.urlInput.value = '';
            }

            removeItem(index) {
                this.playlistData.splice(index, 1);
                this.saveDataToLocal();
                this.updatePlaylistUI();
                if (this.currentVideoIndex === index) this.closeVideo();
                else if (this.currentVideoIndex > index) this.currentVideoIndex--;
            }

            updatePlaylistUI() {
                this.els.playlistContainer.innerHTML = '';
                this.els.playlistCount.textContent = this.playlistData.length;
                
                if (this.playlistData.length === 0) {
                    this.els.playlistContainer.innerHTML = `<div class="p-4 text-gray-500 text-center italic text-xs">Crate is empty.</div>`;
                    return;
                }

                this.playlistData.forEach((item, index) => {
                    const isPlaying = index === this.currentVideoIndex;
                    const itemDiv = document.createElement('div');
                    itemDiv.className = `p-3 flex items-center justify-between cursor-pointer transition ${isPlaying ? 'bg-indigo-900 border-l-4 border-indigo-400' : 'hover:bg-gray-800'}`;
                    itemDiv.onclick = (e) => { if (!e.target.closest('button')) this.openVideo(index); };

                    const titleSpan = document.createElement('span');
                    titleSpan.className = `text-sm font-medium truncate flex-grow ${isPlaying ? 'text-indigo-200' : 'text-gray-300'}`;
                    titleSpan.textContent = `${index + 1}. ${item.title}`;

                    const removeBtn = document.createElement('button');
                    removeBtn.className = 'text-gray-500 hover:text-red-400 ml-2 p-1';
                    removeBtn.innerHTML = `✕`;
                    removeBtn.onclick = (e) => { e.stopPropagation(); this.removeItem(index); };
                    
                    itemDiv.appendChild(titleSpan);
                    itemDiv.appendChild(removeBtn);
                    this.els.playlistContainer.appendChild(itemDiv);
                });
            }

            // --- Playback API Integration ---
            openVideo(index) {
                if (this.playlistData.length === 0) return;
                this.els.videoSection.classList.remove('hidden');
                this.loadVideo(index);
                this.resizeCanvases();
            }

            closeVideo() {
                this.els.videoSection.classList.add('hidden');
                this.destroy();
                this.els.embedContainer.querySelectorAll('.api-target').forEach(e => e.remove());
                this.currentVideoIndex = -1;
                this.updatePlaylistUI();
                if(this.isDjMode) this.toggleDjMode(); 
            }

            destroy() {
                if(this.pollInterval) clearInterval(this.pollInterval);
                if(this.ytPlayer && typeof this.ytPlayer.destroy === 'function') this.ytPlayer.destroy();
                this.ytPlayer = null;
                this.playbackState = { currentTime: 0, duration: 1, playing: false };
            }

            loadVideo(index) {
                if (index < 0 || index >= this.playlistData.length) return;
                
                this.destroy();
                this.currentVideoIndex = index;
                const videoItem = this.playlistData[index];
                
                this.els.videoDisplayTitle.textContent = videoItem.title;

                this.els.embedContainer.querySelectorAll('.api-target').forEach(e => e.remove());
                const targetDiv = document.createElement('div');
                targetDiv.className = 'api-target pointer-events-none'; // In normal mode, we use custom buttons anyway, so disable iframe pointer events always for cleaner UI
                targetDiv.id = `api-target-${this.storageKey}-${Date.now()}`;
                
                // Append BEFORE turntable
                this.els.embedContainer.insertBefore(targetDiv, this.els.turntable);
                
                if (!isYouTubeReady) {
                    this.showMessage("YouTube API loading...");
                    setTimeout(() => this.loadVideo(index), 1000);
                    return;
                }

                // Initialize YouTube Player completely stripped of native UI
                this.ytPlayer = new YT.Player(targetDiv.id, {
                    videoId: videoItem.id,
                    playerVars: { 
                        autoplay: 1, 
                        controls: 0, // No controls
                        disablekb: 1, // No keyboard shortcuts natively
                        fs: 0, // No fullscreen button
                        iv_load_policy: 3, // No annotations
                        rel: 0, // No related videos
                        modestbranding: 1, 
                        playsinline: 1
                    },
                    events: {
                        onReady: (e) => { 
                            this.ytPlayer.setVolume(this.els.volSlider.value);
                            this.playbackState.duration = this.ytPlayer.getDuration() || 1;
                        },
                        onStateChange: (e) => {
                            this.playbackState.playing = (e.data === YT.PlayerState.PLAYING);
                            if (e.data === YT.PlayerState.PLAYING && this.playbackState.duration <= 1) {
                                this.playbackState.duration = this.ytPlayer.getDuration();
                            }
                        }
                    }
                });
                
                this.pollInterval = setInterval(() => this.pollState(), 50); // Fast polling for smooth canvas updates
                this.updatePlaylistUI();
            }

            pollState() {
                if(!this.ytPlayer || typeof this.ytPlayer.getCurrentTime !== 'function') return;
                this.playbackState.currentTime = this.ytPlayer.getCurrentTime() || 0;
                
                this.els.timeDisplay.textContent = `${formatTime(this.playbackState.currentTime)} / ${formatTime(this.playbackState.duration)}`;
                this.drawWaveforms();
            }

            apiSeekTo(seconds) {
                if(!this.ytPlayer) return;
                let target = Math.max(0, Math.min(seconds, this.playbackState.duration - 0.5));
                this.ytPlayer.seekTo(target, true);
                this.playbackState.currentTime = target;
                this.drawWaveforms();
            }

            // --- DJ Mode & Turntable Drag ---
            toggleDjMode() {
                this.isDjMode = !this.isDjMode;
                if (this.isDjMode) {
                    this.els.djToggle.classList.replace('bg-purple-600', 'bg-emerald-600');
                    this.els.djToggle.innerHTML = '🎧 Normal Mode';
                    
                    this.els.djStage.classList.add('dj-mode-stage'); // Enforce strict 1:1 circular aspect ratio
                    this.els.embedContainer.classList.add('dj-mode-active');
                    this.els.canvasCircular.classList.remove('hidden');
                    this.els.linearContainer.classList.add('hidden');
                } else {
                    this.els.djToggle.classList.replace('bg-emerald-600', 'bg-purple-600');
                    this.els.djToggle.innerHTML = '🎧 Enter DJ Mode';
                    
                    this.els.djStage.classList.remove('dj-mode-stage');
                    this.els.embedContainer.classList.remove('dj-mode-active');
                    this.els.canvasCircular.classList.add('hidden');
                    this.els.linearContainer.classList.remove('hidden');
                }
                setTimeout(() => this.resizeCanvases(), 400); // Wait for transition
            }

            startDrag(e) {
                if (!this.isDjMode || this.playbackState.duration <= 1) return;
                this.isDragging = true;
                const rect = this.els.turntable.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                this.lastAngle = Math.atan2(clientY - cy, clientX - cx);
                if (e.cancelable) e.preventDefault();
            }

            onDrag(e) {
                if (!this.isDragging || !this.isDjMode) return;
                const rect = this.els.turntable.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                
                let clientX = e.clientX || (e.touches && e.touches[0].clientX);
                let clientY = e.clientY || (e.touches && e.touches[0].clientY);
                
                let currentAngle = Math.atan2(clientY - cy, clientX - cx);
                let delta = currentAngle - this.lastAngle;
                
                if (delta > Math.PI) delta -= Math.PI * 2;
                if (delta < -Math.PI) delta += Math.PI * 2;

                // Scrub is now strictly Absolute mapping (1 full 360 degree rotation = Full track length)
                let scrubSecs = (delta / (Math.PI * 2)) * this.playbackState.duration;
                let newTime = this.playbackState.currentTime + scrubSecs;
                this.apiSeekTo(newTime);
                
                this.lastAngle = currentAngle;
                if (e.cancelable) e.preventDefault();
            }

            endDrag() { this.isDragging = false; }

            // --- Canvas Rendering & Marker Logic ---
            resizeCanvases() {
                // Linear
                const lRect = this.els.canvasLinear.parentElement.getBoundingClientRect();
                this.els.canvasLinear.width = lRect.width;
                this.els.canvasLinear.height = 60;
                
                // Circular
                const cRect = this.els.djStage.getBoundingClientRect();
                this.els.canvasCircular.width = cRect.width;
                this.els.canvasCircular.height = cRect.height;

                this.drawWaveforms();
            }

            drawWaveforms() {
                this.drawLinearWaveform();
                if(this.isDjMode) {
                    this.drawCircularWaveform();
                    
                    // Visually spin the record so you can feel the scratching 1:1 mapping!
                    const rotationDeg = (this.playbackState.currentTime / this.playbackState.duration) * 360;
                    this.els.turntable.style.transform = `rotate(${rotationDeg}deg)`;
                }
            }

            drawLinearWaveform() {
                const cvs = this.els.canvasLinear;
                const ctx = cvs.getContext('2d');
                const w = cvs.width; const h = cvs.height;
                ctx.clearRect(0, 0, w, h);

                const progress = this.playbackState.duration > 1 ? this.playbackState.currentTime / this.playbackState.duration : 0;

                // Draw base fake waveform
                const bars = this.waveformAmplitudes.length;
                const barW = w / bars;
                for(let i=0; i<bars; i++) {
                    let amp = this.waveformAmplitudes[i] * (h * 0.8);
                    let x = i * barW;
                    let isPast = (i / bars) <= progress;
                    ctx.fillStyle = isPast ? '#6366f1' : '#4b5563'; // Indigo played, gray unplayed
                    ctx.fillRect(x, (h - amp)/2, barW - 1, amp);
                }

                // Draw Markers
                this.markers.forEach(m => {
                    let mx = (m.time / this.playbackState.duration) * w;
                    ctx.fillStyle = m.color;
                    ctx.beginPath();
                    ctx.moveTo(mx - 6, 0); ctx.lineTo(mx + 6, 0); ctx.lineTo(mx, 8); ctx.fill(); // Top caret
                    ctx.fillRect(mx - 1, 0, 2, h); // Line down
                });

                // Draw Playhead
                let px = progress * w;
                ctx.fillStyle = '#fff';
                ctx.fillRect(px - 1, 0, 2, h);
            }

            drawCircularWaveform() {
                const cvs = this.els.canvasCircular;
                const ctx = cvs.getContext('2d');
                const w = cvs.width; const h = cvs.height;
                const cx = w / 2; const cy = h / 2;
                ctx.clearRect(0, 0, w, h);

                // The record itself is ~80% of container. Radius for waveform is slightly larger.
                const baseRadius = (Math.min(w, h) * 0.80) / 2 + 10; 
                
                const progress = this.playbackState.duration > 1 ? this.playbackState.currentTime / this.playbackState.duration : 0;
                const currentAngle = (progress * Math.PI * 2) - (Math.PI / 2); // Start at top (-90deg)

                // Draw circular waveform bars
                const bars = 180;
                for(let i=0; i<bars; i++) {
                    let angle = (i / bars) * Math.PI * 2 - (Math.PI / 2);
                    let amp = this.waveformAmplitudes[i % this.waveformAmplitudes.length] * 15;
                    
                    let innerX = cx + Math.cos(angle) * baseRadius;
                    let innerY = cy + Math.sin(angle) * baseRadius;
                    let outerX = cx + Math.cos(angle) * (baseRadius + amp);
                    let outerY = cy + Math.sin(angle) * (baseRadius + amp);

                    // If the angle is "behind" the playhead (handling wrap around)
                    let normAngle = angle + Math.PI/2;
                    let normCurr = currentAngle + Math.PI/2;
                    let isPast = normAngle <= normCurr;

                    ctx.strokeStyle = isPast ? '#6366f1' : '#4b5563';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.moveTo(innerX, innerY);
                    ctx.lineTo(outerX, outerY);
                    ctx.stroke();
                }

                // Draw Markers on the ring
                this.markers.forEach(m => {
                    let mProg = m.time / this.playbackState.duration;
                    let mAngle = (mProg * Math.PI * 2) - (Math.PI / 2);
                    let mx = cx + Math.cos(mAngle) * (baseRadius + 20);
                    let my = cy + Math.sin(mAngle) * (baseRadius + 20);
                    
                    ctx.fillStyle = m.color;
                    ctx.beginPath();
                    ctx.arc(mx, my, 6, 0, Math.PI*2);
                    ctx.fill();
                    ctx.strokeStyle = '#fff';
                    ctx.stroke();
                });

                // Draw Playhead Indicator on ring
                let px = cx + Math.cos(currentAngle) * (baseRadius + 5);
                let py = cy + Math.sin(currentAngle) * (baseRadius + 5);
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(px, py, 4, 0, Math.PI*2);
                ctx.fill();
            }

            handleCanvasClick(e, mode) {
                if(this.playbackState.duration <= 1) return;
                const rect = e.target.getBoundingClientRect();
                let clickProgress = 0;

                if (mode === 'linear') {
                    let x = e.clientX - rect.left;
                    clickProgress = x / rect.width;
                } else if (mode === 'circular') {
                    // Only process clicks on the outer edge (waveform ring), not inside the record
                    let x = e.clientX - rect.left - rect.width/2;
                    let y = e.clientY - rect.top - rect.height/2;
                    let dist = Math.sqrt(x*x + y*y);
                    const baseRadius = (Math.min(rect.width, rect.height) * 0.80) / 2;
                    
                    if (dist < baseRadius - 10) return; // Clicked inside the record, ignore (handled by drag)

                    let angle = Math.atan2(y, x); // -PI to PI
                    clickProgress = (angle + Math.PI/2) / (Math.PI*2);
                    if (clickProgress < 0) clickProgress += 1;
                }

                let clickTime = clickProgress * this.playbackState.duration;

                // Check if clicking near an existing marker to interact with it
                let clickedMarkerIndex = -1;
                for (let i = 0; i < this.markers.length; i++) {
                    let mTime = this.markers[i].time;
                    let timeDiff = Math.abs(mTime - clickTime);
                    // ~1.5% tolerance
                    if (timeDiff / this.playbackState.duration < 0.015) {
                        clickedMarkerIndex = i;
                        break;
                    }
                }

                if (this.activeColor === 'rubber') {
                    // Eraser mode
                    if (clickedMarkerIndex !== -1) {
                        this.markers.splice(clickedMarkerIndex, 1);
                        this.saveDataToLocal();
                    }
                } else {
                    // Crayon mode
                    if (clickedMarkerIndex !== -1) {
                        // Clicked an existing marker while holding a crayon -> Jump to it! (Hot cue)
                        this.apiSeekTo(this.markers[clickedMarkerIndex].time);
                    } else {
                        // Clicked empty space -> Place new marker
                        this.markers.push({ time: clickTime, color: this.activeColor });
                        this.saveDataToLocal();
                    }
                }
                this.drawWaveforms();
            }
        }

        // --- Initialization ---
        let playerCount = 0;
        function addPlayer() {
            playerCount++;
            new PlaylistPlayer('players-grid', `dj_data_deck_${playerCount}`, `Deck ${playerCount}`);
        }

        document.addEventListener('DOMContentLoaded', () => {
            addPlayer(); addPlayer(); // Initialize with two decks
            document.getElementById('addPlayerBtn').addEventListener('click', addPlayer);
            document.getElementById('micRecordBtn').addEventListener('click', () => MicRecorder.toggle());
        });
    </script>
</body>
</html>
